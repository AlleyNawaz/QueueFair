name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queuefair
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: queuefair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuefair -d queuefair_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://queuefair:ci-ephemeral-only@127.0.0.1:5432/queuefair_test
      TEST_DATABASE_URL: postgresql://queuefair:ci-ephemeral-only@127.0.0.1:5432/queuefair_test
      APP_ORIGIN: http://127.0.0.1:3100
      SESSION_SECRET: ephemeral-ci-session-secret-at-least-32-characters
      DEMO_MODE: "true"
      ENABLE_DEMO_RESET: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ephemeral demo passwords and test environment
        run: |
          echo "DEMO_STAFF_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DEMO_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          touch .env.test
      - run: pnpm db:generate
      - run: pnpm db:migrate:test
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
